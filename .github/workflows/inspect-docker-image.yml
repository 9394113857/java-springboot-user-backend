name: 🔍 Inspect Latest Docker Image

on:
  workflow_dispatch:

jobs:

  # ============================================================
  # INSPECT LATEST DOCKER IMAGE
  # ============================================================

  inspect-image:

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # 1. Pull latest Docker image
      # ========================================================

      - name: 🐳 Pull latest Docker image
        run: |
          echo "=============================================="
          echo "🐳 PULLING LATEST DOCKER IMAGE"
          echo "=============================================="

          docker pull pythoncodelife/java-springboot-user-backend:latest


      # ========================================================
      # 2. Display Docker image information
      # ========================================================

      - name: 🔎 Inspect Docker image
        run: |
          echo ""
          echo "=============================================="
          echo "🔎 DOCKER IMAGE INSPECTION"
          echo "=============================================="

          echo ""
          echo "===== IMAGE ID ====="
          docker inspect \
            pythoncodelife/java-springboot-user-backend:latest \
            --format='{{.Id}}'

          echo ""
          echo "===== CREATED ====="
          docker inspect \
            pythoncodelife/java-springboot-user-backend:latest \
            --format='{{.Created}}'

          echo ""
          echo "===== ENTRYPOINT ====="
          docker inspect \
            pythoncodelife/java-springboot-user-backend:latest \
            --format='{{json .Config.Entrypoint}}'

          echo ""
          echo "===== CMD ====="
          docker inspect \
            pythoncodelife/java-springboot-user-backend:latest \
            --format='{{json .Config.Cmd}}'

          echo ""
          echo "===== EXPOSED PORTS ====="
          docker inspect \
            pythoncodelife/java-springboot-user-backend:latest \
            --format='{{json .Config.ExposedPorts}}'

          echo ""
          echo "===== WORKING DIRECTORY ====="
          docker inspect \
            pythoncodelife/java-springboot-user-backend:latest \
            --format='{{.Config.WorkingDir}}'

          echo ""
          echo "===== ARCHITECTURE ====="
          docker inspect \
            pythoncodelife/java-springboot-user-backend:latest \
            --format='{{.Architecture}}'

          echo ""
          echo "===== OS ====="
          docker inspect \
            pythoncodelife/java-springboot-user-backend:latest \
            --format='{{.Os}}'

          echo ""
          echo "=============================================="
          echo "🔎 INSPECTION COMPLETE"
          echo "=============================================="


      # ========================================================
      # 3. Display Docker image history
      # ========================================================

      - name: 📜 Show Docker image history
        run: |
          echo ""
          echo "=============================================="
          echo "📜 DOCKER IMAGE HISTORY"
          echo "=============================================="

          docker history \
            pythoncodelife/java-springboot-user-backend:latest

          echo ""
          echo "=============================================="
          echo "📜 HISTORY COMPLETE"
          echo "=============================================="


      # ========================================================
      # 4. Display complete Docker configuration
      # ========================================================

      - name: 🧩 Show complete Docker configuration
        run: |
          echo ""
          echo "=============================================="
          echo "🧩 COMPLETE DOCKER CONFIGURATION"
          echo "=============================================="

          docker inspect \
            pythoncodelife/java-springboot-user-backend:latest

          echo ""
          echo "=============================================="
          echo "🧩 CONFIGURATION COMPLETE"
          echo "=============================================="
