# =========================================================
# 🚀 SERVER
# =========================================================

# Render provides PORT automatically.
# Local/default fallback is 8080.
server.port=${PORT:8080}


# =========================================================
# 🐘 DATABASE - SUPABASE / POSTGRESQL
# =========================================================

# These values come from Render Environment Variables.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# PostgreSQL JDBC driver.
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# 🧩 JPA / HIBERNATE
# =========================================================

# ✅ Use the existing Supabase database structure.
# ❌ Hibernate will NOT create, modify, or delete tables.
spring.jpa.hibernate.ddl-auto=validate

# PostgreSQL dialect.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQL logging.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# 🛫 FLYWAY DATABASE MIGRATIONS
# =========================================================

# ✅ IMPORTANT:
# Supabase already contains the required tables.
# Flyway will NOT run migrations in production.
spring.flyway.enabled=false

# Migration location is kept for future use.
# It is ignored while Flyway is disabled.
spring.flyway.locations=classpath:db/migration


# =========================================================
# 🌐 CORS
# =========================================================

# Allow Angular frontend requests.
# Fine for initial deployment/testing.
spring.web.cors.allowed-origins=*

spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

spring.web.cors.allowed-headers=*


# =========================================================
# ❤️ ACTUATOR / HEALTH CHECK
# =========================================================

# Expose health endpoint for Render.
management.endpoints.web.exposure.include=health

# Show health details.
management.endpoint.health.show-details=always