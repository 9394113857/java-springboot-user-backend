# =========================================================
# SERVER
# =========================================================

# Render provides PORT automatically.
# Local/default fallback is 8080.
server.port=${PORT:8080}


# =========================================================
# DATABASE - SUPABASE / POSTGRESQL
# =========================================================

# These values are provided through Render Environment Variables.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# PostgreSQL JDBC driver
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

# Validate the existing database structure.
# Hibernate will NOT create, alter, or delete tables.
spring.jpa.hibernate.ddl-auto=validate

# PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQL logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# FLYWAY DATABASE MIGRATIONS
# =========================================================

# Enable Flyway
spring.flyway.enabled=true

# Location of migration files inside the application
spring.flyway.locations=classpath:db/migration

# The Supabase database already contains your existing tables.
# Create Flyway's schema history table and baseline the existing schema
# instead of treating the existing tables as an empty database.
spring.flyway.baseline-on-migrate=true

# Baseline existing database at version 0.
# Future migrations such as V1__..., V2__..., etc. can be tracked normally.
spring.flyway.baseline-version=0


# =========================================================
# CORS
# =========================================================

# Allow requests from the Angular frontend.
# For initial deployment/testing, all origins are allowed.
spring.web.cors.allowed-origins=*

spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

spring.web.cors.allowed-headers=*


# =========================================================
# ACTUATOR / HEALTH CHECK
# =========================================================

# Expose the health endpoint for Render health checks.
management.endpoints.web.exposure.include=health

# Show health details.
management.endpoint.health.show-details=always