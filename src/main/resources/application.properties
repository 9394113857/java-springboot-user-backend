# =========================================================
# APPLICATION
# =========================================================

spring.application.name=java-springboot-user-backend


# =========================================================
# SERVER
# =========================================================

# Local application runs on port 8080.
# PORT can still be supplied externally if needed.
server.port=${PORT:8080}


# =========================================================
# LOCAL DATABASE - SQLITE
# =========================================================

spring.datasource.url=jdbc:sqlite:./data/java-user-backend.db

spring.datasource.driver-class-name=org.sqlite.JDBC


# =========================================================
# JPA / HIBERNATE - SQLITE
# =========================================================

# Validate the existing database schema.
# Hibernate will NOT create, update, or delete tables.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# FLYWAY - LOCAL SQLITE
# =========================================================

spring.flyway.enabled=true

# IMPORTANT:
# Local development uses ONLY SQLite migrations.
spring.flyway.locations=classpath:db/migration/sqlite


# =========================================================
# CORS
# =========================================================

# Allow local Angular frontend access.
spring.web.cors.allowed-origins=*

spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

spring.web.cors.allowed-headers=*


# =========================================================
# ACTUATOR / HEALTH
# =========================================================

management.endpoints.web.exposure.include=health

management.endpoint.health.show-details=always