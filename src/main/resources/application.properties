# =========================================================
# APPLICATION
# =========================================================

spring.application.name=java-springboot-user-backend


# =========================================================
# SERVER
# =========================================================

# Render provides PORT in production.
# Local application uses 8080 by default.
server.port=${PORT:8080}


# =========================================================
# LOCAL DATABASE - SQLITE
# =========================================================

# Local development continues using the existing SQLite database.
spring.datasource.url=jdbc:sqlite:./data/java-user-backend.db

spring.datasource.driver-class-name=org.sqlite.JDBC


# =========================================================
# JPA / HIBERNATE - SQLITE
# =========================================================

# Validate the existing schema.
# Hibernate does not create, update, or delete tables.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration


# =========================================================
# CORS
# =========================================================

# Angular frontend access.
spring.web.cors.allowed-origins=*

spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

spring.web.cors.allowed-headers=*


# =========================================================
# ACTUATOR / HEALTH
# =========================================================

management.endpoints.web.exposure.include=health

management.endpoint.health.show-details=always